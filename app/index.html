<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>تقویم سینما و سریال | تاریخ اکران و پخش آنلاین</title>
    <meta name="description" content="تقویم شمسی جلالی انتشار جدیدترین فیلم‌ها و سریال‌های روز جهان با امکان جستجوی آفلاین و یادآور اکران" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/fonts/Vazirmatn-font-face.css" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('app_theme');
          var isDark = saved === 'dark' || (!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          if (!isDark) {
            root.classList.add('light');
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans min-h-screen selection:bg-amber-500/20 selection:text-amber-300">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
