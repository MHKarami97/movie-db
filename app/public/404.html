<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>در حال انتقال...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Stores path and search in query string and redirects to index.html
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var origin = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectUrl = origin + (pathSegmentsToKeep > 0 ? '/' + l.pathname.slice(1).split('/')[0] : '') +
        '/?p=/' + path + (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      l.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
