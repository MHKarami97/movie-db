name: Sync TMDB Catalog to Data Branch

on:
  schedule:
    # Run every 12 hours at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      refresh_budget:
        description: 'Max outdated records to re-fetch in this run (empty = default 200)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit_step.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Git Actor
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare Orphan Data Branch Directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE_REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p ../data-branch
          # Check if remote 'data' branch exists
          if git ls-remote --exit-code --heads "$REMOTE_REPO" data; then
            echo "Fetching existing data branch..."
            git clone --branch data --single-branch "$REMOTE_REPO" ../data-branch
          else
            echo "Initializing orphan data branch..."
            cd ../data-branch
            git init
            git checkout --orphan data
            git remote add origin "$REMOTE_REPO"
          fi

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Sync Program
        run: npm run build:sync

      - name: Run TMDB Sync
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          SYNC_REFRESH_BUDGET: ${{ github.event.inputs.refresh_budget }}
        run: |
          node sync/dist/index.js

      - name: Commit and Push to Data Branch
        id: commit_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ../data-branch
          REMOTE_REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "$REMOTE_REPO"
          git add -A

          # If nothing changed, exit gracefully without commit or push
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No catalog changes detected. Skipping commit and push."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            DATE_ISO=$(date -u +"%Y-%m-%d")
            COMMIT_MSG="data: sync TMDB catalog [${DATE_ISO}]"

            # Check if branch has an existing commit to amend
            if git rev-parse --verify HEAD >/dev/null 2>&1; then
              git commit --amend -m "${COMMIT_MSG}"
            else
              git commit -m "${COMMIT_MSG}"
            fi

            git push origin data --force-with-lease || git push origin data --force
            echo "Successfully updated and pushed data branch."
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-app.yml
    secrets: inherit
